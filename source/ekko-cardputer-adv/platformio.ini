[platformio]
default_envs = cardputer-adv

[env:cardputer-adv]
platform = espressif32@7.0.1
board = m5stack-stamps3
framework = arduino
platform_packages =
  platformio/framework-arduinoespressif32@3.20017.241212+sha.dcc1105b
  platformio/tool-esptoolpy@2.41100.0
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
upload_speed = 1500000
board_build.partitions = partitions.csv
board_upload.flash_size = 8MB
lib_deps =
  m5stack/M5Unified@0.2.26
  m5stack/M5Cardputer@1.1.1
  m5stack/M5GFX@0.2.33
  z3t0/IRremote@4.7.1
  olikraus/U8g2@2.36.18
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -Wl,--wrap=esp_partition_erase_range
  -DARDUINO_LOOP_STACK_SIZE=12288
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
  -DCORE_DEBUG_LEVEL=0
  -DCARDPUTER_ADV
